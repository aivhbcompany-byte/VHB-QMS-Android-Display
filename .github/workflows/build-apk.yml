name: Build VHB QMS Android Display 2.2.8 Fast Direct Boot
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: geckoview-omni-arm64-v8a
            suffix: ARM64
          - abi: armeabi-v7a
            artifact: geckoview-omni-armeabi-v7a
            suffix: ARM32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply 2.2.4 keyboard dismiss base patch
        run: patch -p1 < patches/2.2.4-keyboard-dismiss.patch
      - name: Apply 2.2.5 admin dialog keyboard fix
        run: python3 tools/apply_225.py
      - name: Apply 2.2.6 one-touch HOME provisioning
        run: python3 tools/apply_226.py
      - name: Apply 2.2.7 PANAPLAYBOX full-component HOME fix
        run: python3 tools/apply_227.py
      - name: Apply 2.2.8 Fast Direct Boot
        run: python3 tools/apply_228.py
      - name: Build GeckoView ${{ matrix.suffix }} Fast Direct Boot APK
        run: gradle :app:assembleDebug -PvhbGeckoArtifact=${{ matrix.artifact }} --stacktrace
      - name: Package artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VHB_QMS_Android_Display_2.2.8_FAST_DIRECT_BOOT_${{ matrix.suffix }}.apk
          sha256sum VHB_QMS_Android_Display_2.2.8_FAST_DIRECT_BOOT_${{ matrix.suffix }}.apk > VHB_QMS_Android_Display_2.2.8_FAST_DIRECT_BOOT_${{ matrix.suffix }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VHB-QMS-Android-Display-2.2.8-FAST-DIRECT-BOOT-${{ matrix.suffix }}
          path: |
            VHB_QMS_Android_Display_2.2.8_FAST_DIRECT_BOOT_${{ matrix.suffix }}.apk
            VHB_QMS_Android_Display_2.2.8_FAST_DIRECT_BOOT_${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 7
