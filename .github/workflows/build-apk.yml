name: Build VHB QMS Android Display 2.2.1 Compatibility
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: geckoview-omni-arm64-v8a
            suffix: ARM64
          - abi: armeabi-v7a
            artifact: geckoview-omni-armeabi-v7a
            suffix: ARM32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build GeckoView ${{ matrix.suffix }} debug APK
        run: gradle :app:assembleDebug -PvhbGeckoArtifact=${{ matrix.artifact }} --stacktrace
      - name: Package artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.apk
          sha256sum VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.apk > VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.sha256
          unzip -l VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/.+\.so' | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: VHB-QMS-Android-Display-2.2.1-GeckoView-${{ matrix.suffix }}-SIDE-BY-SIDE
          path: |
            VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.apk
            VHB_QMS_Android_Display_2.2.1_GeckoView_${{ matrix.suffix }}_SIDE_BY_SIDE.sha256
          if-no-files-found: error
          retention-days: 7
