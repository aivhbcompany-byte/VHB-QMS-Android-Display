name: Export preinstalled public Android NDK ARM32 compiler for local build
on:
  push:
    branches: [vhb-temp-android-toolchain-20261030]
jobs:
  export-ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Pack publicly available NDK toolchain (no user code)
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah "$ANDROID_HOME/ndk"
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK"
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          du -sh "$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          tar -C "$NDK" -czf "$RUNNER_TEMP/ndk-llvm-linux-x86_64.tar.gz" toolchains/llvm/prebuilt/linux-x86_64
          ls -lh "$RUNNER_TEMP/ndk-llvm-linux-x86_64.tar.gz"
          split -b 250m "$RUNNER_TEMP/ndk-llvm-linux-x86_64.tar.gz" "$RUNNER_TEMP/ndkpart."
          ls -lh "$RUNNER_TEMP"/ndkpart.*
      - uses: actions/upload-artifact@v4
        with:
          name: vhb-public-ndk-arm32-part-aa
          path: ${{ runner.temp }}/ndkpart.aa
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vhb-public-ndk-arm32-part-ab
          path: ${{ runner.temp }}/ndkpart.ab
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vhb-public-ndk-arm32-part-ac
          path: ${{ runner.temp }}/ndkpart.ac
          if-no-files-found: error
          retention-days: 1
