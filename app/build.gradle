plugins { id 'com.android.application' }

android {
    namespace 'vn.com.vhb.qmsdisplay'
    compileSdk 36
    defaultConfig {
        // 2.2.1 compatibility build uses a separate applicationId so it can be
        // installed alongside any old VHB build signed with a different key.
        applicationId 'vn.com.vhb.qmsdisplay.gecko'
        minSdk 28
        targetSdk 36
        versionCode 2020100
        versionName '2.2.1'
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def geckoVersion = '153.0.20260810162159'
def geckoArtifact = project.findProperty('vhbGeckoArtifact') ?: 'geckoview-omni-arm64-v8a'

dependencies {
    implementation "org.mozilla.geckoview:${geckoArtifact}:${geckoVersion}"
}
